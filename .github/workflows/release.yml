name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.4.0
        required: true
        type: string
      verify_only:
        description: Test the selected ref with signing secrets without creating a release (tag supplies only the version)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.verify_only && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build both architectures with fixed publisher identity
        env:
          DAYLOG_SIGNING_P12_BASE64: ${{ secrets.DAYLOG_SIGNING_P12_BASE64 }}
          DAYLOG_SIGNING_PASSWORD: ${{ secrets.DAYLOG_SIGNING_PASSWORD }}
        run: DAYLOG_VERSION="${RELEASE_TAG#v}" python3 scripts/with-signing.py -- sh scripts/build.sh --all-arches
      - run: python3 scripts/verify-runtime.py --skip-native-check
      - run: python3 scripts/verify-installer.py
      - name: Prepare release assets
        run: python3 scripts/package-release.py --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daylog-${{ env.RELEASE_TAG }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Create draft release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo 'This release is already published; create a new version tag.'; exit 1; }
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
              --title "Daylog $RELEASE_TAG" --notes-file .github/release-notes.md
          fi

  windows-release-check:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.verify_only && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daylog-${{ inputs.tag || github.ref_name }}
          path: release-assets
      - name: Verify signed Windows installer and updater
        run: python scripts/verify-windows-signed.py release-assets
