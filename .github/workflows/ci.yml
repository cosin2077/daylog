name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false # standard library only; no go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: sh scripts/build.sh
      - name: Isolated runtime verification (no real screenshots or model calls)
        run: python3 scripts/verify-runtime.py --skip-native-check
      - name: Installer verification
        run: python3 scripts/verify-installer.py

