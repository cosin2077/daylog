<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Daylog · 工作记录</title>
<style>
:root{color-scheme:light;--paper:#f7f5ef;--ink:#292d29;--muted:#656b61;--line:#dcded3;--accent:#b14b2d;--work:#426955;--learn:#ad782e;--talk:#6e7693;--other:#939486;--wash:#eceee5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{color:inherit}a{color:inherit}.page{max-width:1160px;margin:auto;padding:0 clamp(20px,5vw,64px) 48px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:26px 0;border-bottom:1px solid var(--line)}.wordmark{font-family:Georgia,serif;font-size:22px;letter-spacing:.17em}.wordmark span{color:var(--accent)}.mastnote{color:var(--muted);font-size:12px;letter-spacing:.08em}.sample{display:none;color:var(--accent);font-size:12px;padding:10px 0;border-bottom:1px solid var(--line)}.hero{padding:34px 0 26px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.16em;margin:0 0 14px}.hero h1{font-family:"Songti SC","STSong",Georgia,serif;font-weight:500;font-size:clamp(34px,5.6vw,60px);line-height:1.25;letter-spacing:-.025em;margin:0}.lede{color:var(--muted);max-width:760px;margin:17px 0 0;font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:28px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0 12px;color:var(--muted);font-weight:500}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}.quiet-button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:6px 12px;font-size:12px}.quiet-button:hover{background:var(--wash)}.stats{display:flex;flex-wrap:wrap;gap:9px 24px;padding:21px 0;font-size:13px;color:var(--muted)}.stats strong{font-weight:600;color:var(--ink);font-size:16px;margin-right:5px}.notice{padding:12px 16px;margin:0 0 20px;background:#eee9d9;color:#6c552b;font-size:13px;border-radius:3px}.distribution{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0 12px;margin-bottom:32px}.section-label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 17px;font-size:12px;color:var(--muted)}.section-label span:last-child{font-size:11px}.bars{display:grid;gap:5px;height:100px;align-items:end}.bar-button{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:6px;border:0;background:none;padding:0}.bar-track{height:77px;flex:0 0 77px;display:flex;align-items:flex-end;background:transparent}.bar-fill{display:block;width:100%;min-height:3px;background:#c5cdbd;border-radius:2px 2px 0 0;transition:background .15s}.bar-button:hover .bar-fill,.bar-button[aria-pressed=true] .bar-fill{background:var(--work)}.bar-button.is-empty .bar-fill{background:var(--line)}.bar-button.is-pending .bar-fill{background:#c4a46b}.bar-caption{display:block;height:16px;flex:0 0 16px;font-size:10px;color:var(--muted);text-align:center;line-height:16px;white-space:nowrap}.content{display:grid;grid-template-columns:208px minmax(0,1fr);gap:40px}.aside{border-right:1px solid var(--line);padding-right:26px}.aside h2,.feed-heading{font-size:13px;font-weight:600;margin:0 0 20px;letter-spacing:.05em}.category-list{display:flex;flex-direction:column;gap:7px}.category-button{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:9px;text-align:left;width:100%;border:0;background:none;padding:7px 0;font-size:13px}.category-button[aria-pressed=true]{font-weight:600;color:var(--accent)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--other);flex:none}.work{background:var(--work)}.learn{background:var(--learn)}.talk{background:var(--talk)}.other{background:var(--other)}.count{font-size:12px;color:var(--muted)}.category-meter{height:3px;background:var(--line);margin:0 0 9px 17px;overflow:hidden}.category-meter span{display:block;height:100%;background:var(--work)}.aside-note{font-size:12px;color:var(--muted);margin-top:34px;line-height:1.85}.aside-note strong{display:block;color:var(--ink);font-size:12px;font-weight:500;margin-bottom:6px}.feed-top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:13px}.feed-heading{margin:0}.search{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;max-width:215px;min-width:0;width:45%;padding:6px 0;font-size:13px;color:var(--ink)}.selection{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);min-height:30px;margin-bottom:9px}.selection button{font-size:12px;border:0;background:none;color:var(--accent);padding:0}.activities{list-style:none;margin:0;padding:0}.day-heading{padding:22px 0 8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);letter-spacing:.02em}.day-heading:first-child{border:0;padding-top:5px}.activity{display:grid;grid-template-columns:82px minmax(0,1fr);gap:16px;padding:21px 0;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.time{font-size:12px;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums;padding-top:3px}.time span{display:block}.time span:last-child{color:#85897f}.activity h3{font-size:17px;line-height:1.5;margin:0 0 7px;font-weight:600;overflow-wrap:anywhere}.activity p{margin:0;color:#565e54;font-size:14px;line-height:1.85;overflow-wrap:anywhere}.activity-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-top:11px}.activity-meta .separator{margin:0 3px;color:#b5b9ad}.evidence{font-size:11px;color:var(--muted);margin-top:10px}.evidence summary{cursor:pointer;width:fit-content}.evidence p{font-size:11px;margin-top:5px;color:var(--muted)}.empty{padding:46px 0 55px;border-top:1px solid var(--line)}.empty h3{font-family:"Songti SC",Georgia,serif;font-size:25px;font-weight:500;margin:0 0 10px}.empty p{color:var(--muted);font-size:13px;max-width:430px}.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0;font-size:12px;color:var(--muted)}.pagination-controls{display:flex;gap:8px}.pagination button:disabled{opacity:.4;cursor:default}.footer{border-top:1px solid var(--line);margin-top:40px;padding-top:17px;display:flex;justify-content:space-between;gap:18px;font-size:11px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:700px){.page{padding:0 20px 30px}.masthead{padding:20px 0}.mastnote{max-width:125px;text-align:right;line-height:1.5}.hero{padding:26px 0 22px}.content{grid-template-columns:1fr;gap:20px}.aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 13px}.aside h2{margin-bottom:8px}.category-list{flex-direction:row;flex-wrap:wrap;gap:4px 17px}.category-button{width:auto;gap:6px}.category-meter,.aside-note{display:none}.distribution{margin-bottom:23px}.stats{gap:8px 18px}.activity{grid-template-columns:63px minmax(0,1fr);gap:12px}.activity h3{font-size:16px}.bars{gap:3px}.bar-caption{font-size:9px}.footer{flex-direction:column;gap:4px}.search{width:52%;max-width:200px}.tabs{gap:25px}.pagination{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:white;color:#222}.page{max-width:none;padding:0}.tabs,.print,.search,.pagination-controls,.selection button{display:none!important}.toolbar{border:0}.hero{padding:20px 0}.content{display:block}.aside{display:none}.distribution{break-inside:avoid}.activity{break-inside:avoid}.footer{margin-top:20px}.pagination{display:none}.mastnote{color:#444}}
</style>
</head>
<body data-initial="{{.Initial}}">
<main class="page">
<header class="masthead"><div class="wordmark">DAYLOG<span>.</span></div><div class="mastnote">让一天留下清晰的线索</div></header>
<div id="sample" class="sample">示例报告 · 以下活动均为演示数据</div>
<section class="hero"><p id="eyebrow" class="eyebrow">工作记录</p><h1 id="title">正在准备报告</h1><p id="lede" class="lede"></p></section>
<div class="toolbar"><nav class="tabs" role="tablist" aria-label="报告周期"><button id="tab-day" data-period="day" role="tab" aria-controls="report-panel">日报</button><button id="tab-week" data-period="week" role="tab" aria-controls="report-panel">周报</button><button id="tab-month" data-period="month" role="tab" aria-controls="report-panel">月报</button><button id="tab-range" data-period="range" role="tab" aria-controls="report-panel" hidden>时段报告</button></nav><button class="quiet-button print" id="print">打印 / 保存 PDF</button></div>
<section id="report-panel" role="tabpanel" aria-labelledby="tab-day">
<div id="stats" class="stats"></div><div id="notice" class="notice" role="status" hidden></div>
<section class="distribution" aria-label="活动分布"><div class="section-label"><span id="chart-title">记录分布</span><span>点击柱形筛选片段</span></div><div id="bars" class="bars"></div></section>
<div class="content"><aside class="aside"><h2>记录类型</h2><div id="categories" class="category-list"></div><p class="aside-note"><strong>关于这份记录</strong>来自已分析的屏幕活动。空白代表缺少记录，不代表没有工作。记录覆盖范围不等于精确工时。</p></aside>
<section class="feed"><div class="feed-top"><h2 class="feed-heading">活动时间线</h2><input id="search" class="search" type="search" placeholder="搜索活动" aria-label="搜索活动标题与摘要"></div><div id="selection" class="selection"></div><ol id="activities" class="activities"></ol><div id="empty" class="empty" hidden><h3 id="empty-title">还没有已整理的活动</h3><p id="empty-text">完成分析的活动会出现在这里。未记录的时间不会被补写。</p></div><div class="pagination"><span id="page-label"></span><div class="pagination-controls"><button id="previous" class="quiet-button">上一页</button><button id="next" class="quiet-button">下一页</button></div></div></section></div>
</section>
<footer class="footer"><span id="generated"></span><span>空白代表缺少记录 · 覆盖范围不等于工时</span></footer>
<noscript><p>请允许此本地文件运行 JavaScript，以切换报告周期和查看时间线。</p></noscript>
</main>
<script type="application/json" id="report-data">{{.Data}}</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),kinds=data.views.map(v=>v.period),labels={day:'日报',week:'周报',month:'月报',range:'时段报告'},colors={'工作':'work','学习':'learn','沟通':'talk','其他':'other'};
let printing=false;
const state={period:document.body.dataset.initial,category:'全部',day:'',hour:null,query:'',page:0},pageSize=40;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
const calendar=d=>new Date(d+'T12:00:00Z');
const dateText=(d,options)=>calendar(d).toLocaleDateString('zh-CN',{timeZone:'UTC',...options});
const previousDate=d=>{const v=calendar(d);v.setUTCDate(v.getUTCDate()-1);return v.toISOString().slice(0,10)};
const duration=s=>s===0?'0 分钟':s<60?'不足 1 分钟':s<3600?Math.floor(s/60)+' 分钟':Math.floor(s/3600)+' 小时'+(s%3600>=60?' '+Math.floor(s%3600/60)+' 分钟':'');
const view=()=>data.views.find(v=>v.period===state.period);
function selectPeriod(kind){state.period=kind;state.category='全部';state.day='';state.hour=null;state.page=0;render()}
function render(){const v=view(),first=v.start.slice(0,10),last=state.period==='range'?v.end.slice(0,10):previousDate(v.end.slice(0,10));
 $('eyebrow').textContent=labels[state.period]+' / '+(first.slice(0,4)===last.slice(0,4)?first.slice(0,4):first.slice(0,4)+'–'+last.slice(0,4));
 const title=state.period==='range'?v.start.slice(5,16).replace('T',' ')+' — '+v.end.slice(5,16).replace('T',' '):state.period==='day'?dateText(first,{month:'long',day:'numeric'}):state.period==='week'?dateText(first,{month:'long',day:'numeric'})+' — '+dateText(last,{month:'long',day:'numeric'}):dateText(first,{month:'long'})+'工作回顾';
 $('title').textContent=title;document.title='Daylog · '+first+' '+labels[state.period];$('lede').textContent=v.summary;
 document.querySelectorAll('[data-period]').forEach(b=>{b.hidden=!kinds.includes(b.dataset.period);const active=b.dataset.period===state.period;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});$('report-panel').setAttribute('aria-labelledby','tab-'+state.period);
 $('stats').replaceChildren();for(const [value,label] of [[v.activities.length,'个活动片段'],[v.active_days,'个有记录日'],[duration(v.coverage_seconds),'记录覆盖'],[v.evidence_count,'张关联截图']]){const n=el('span');n.append(el('strong','',value),document.createTextNode(label));$('stats').append(n)}
 const notes=[];if(v.estimated_seconds)notes.push('观察估计约 '+duration(v.estimated_seconds));if(v.interpolated_seconds)notes.push('其中 '+duration(v.interpolated_seconds)+' 来自关键帧间估算');if(v.unknown_seconds)notes.push('已分析批次内约 '+duration(v.unknown_seconds)+' 证据不足');if(v.legacy_coverage_seconds)notes.push('含旧版模型时间范围 '+duration(v.legacy_coverage_seconds));if(v.pending_batches)notes.push(v.pending_batches+' 批记录尚未分析');if(v.failed_batches)notes.push(v.failed_batches+' 批分析未成功');if(v.draft_frames)notes.push(v.draft_frames+' 张截图仍在当前采集批次中');$('notice').hidden=notes.length===0;$('notice').textContent=notes.join(' · ')+(v.pending_batches||v.draft_frames?'。当前报告尚不完整。':'');
 renderBars(v);renderCategories(v);renderActivities(v);
}
function renderBars(v){const hourly=state.period==='day';$('chart-title').textContent=hourly?'一天中的记录 · 按小时':'日期分布 · 按活动片段数';const series=hourly?Array.from({length:24},(_,h)=>({key:h,count:v.activities.filter(a=>Number(a.start.slice(11,13))===h).length,pending:0})):v.days.map(d=>({key:d.date,count:d.activities,pending:d.pending_batches}));const max=Math.max(1,...series.map(d=>d.count));const bars=$('bars');bars.replaceChildren();bars.style.gridTemplateColumns='repeat('+series.length+',minmax(0,1fr))';
 series.forEach((item,i)=>{const selected=hourly?state.hour===item.key:state.day===item.key;const caption=hourly?(i%6===0||i===23?String(i).padStart(2,'0'):''):(series.length<=7||i%5===0||i===series.length-1?String(Number(item.key.slice(8))):'');const label=hourly?item.key+' 时':item.key;const b=el('button','bar-button'+(!item.count?' is-empty':'')+(item.pending&&!item.count?' is-pending':''));b.type='button';b.setAttribute('aria-label',label+'，'+item.count+' 个活动片段'+(item.pending?'，有待分析记录':''));b.setAttribute('aria-pressed',String(selected));b.title=b.getAttribute('aria-label');const track=el('span','bar-track'),fill=el('span','bar-fill');fill.style.height=(item.count?Math.max(5,item.count/max*100):3)+'%';track.append(fill);b.append(track,el('span','bar-caption',caption));b.addEventListener('click',()=>{if(hourly)state.hour=selected?null:item.key;else state.day=selected?'':item.key;state.page=0;render()});bars.append(b)});
}
function renderCategories(v){$('categories').replaceChildren();[{name:'全部',count:v.activities.length},...v.categories].forEach(c=>{const box=el('div'),b=el('button','category-button');b.type='button';b.setAttribute('aria-pressed',String(state.category===c.name));b.append(el('span','dot '+(colors[c.name]||'other')),el('span','',c.name),el('span','count',c.count));b.addEventListener('click',()=>{state.category=c.name;state.page=0;render()});box.append(b);if(c.name!=='全部'){const meter=el('div','category-meter'),fill=el('span');fill.style.width=(v.activities.length?c.count/v.activities.length*100:0)+'%';fill.style.background='var(--'+(colors[c.name]||'other')+')';meter.append(fill);box.append(meter)}$('categories').append(box)})}
function renderActivities(v){const q=state.query.toLocaleLowerCase();const activities=v.activities.filter(a=>(state.category==='全部'||a.category===state.category)&&(!state.day||a.start.slice(0,10)===state.day)&&(state.hour===null||Number(a.start.slice(11,13))===state.hour)&&(!q||(a.title+' '+a.summary).toLocaleLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(activities.length/pageSize));state.page=Math.min(state.page,pages-1);const visible=printing?activities:activities.slice(state.page*pageSize,(state.page+1)*pageSize);$('activities').replaceChildren();let day='';
 for(const a of visible){const current=a.start.slice(0,10);if(current!==day){day=current;$('activities').append(el('li','day-heading',dateText(day,{month:'long',day:'numeric',weekday:'long'})))}const item=el('li','activity'),when=el('time','time');when.dateTime=a.start;when.append(el('span','',a.start.slice(11,16)),el('span','',a.end.slice(0,10)!==current?'24:00':a.end.slice(11,16)));const body=el('div');body.append(el('h3','',a.title),el('p','',a.summary));const meta=el('div','activity-meta');meta.append(el('span','dot '+colors[a.category]),el('span','',a.category),el('span','separator','·'),el('span','',a.source==='api'?'自定义模型':a.source.startsWith('agent:')?a.source.slice(6):'Agent'));if(a.duration_method==='bounded_observation_v1')meta.append(el('span','separator','·'),el('span','',a.estimated_seconds?'观察估计约 '+duration(a.estimated_seconds):'证据不足以估算时长'));if(a.interpolated_seconds)meta.append(el('span','', '（含 '+duration(a.interpolated_seconds)+' 关键帧间估算）'));body.append(meta);if(a.evidence.length){const details=el('details','evidence');details.append(el('summary','',a.evidence.length+' 张截图提供依据'),el('p','',a.evidence.join(' · ')));body.append(details)}item.append(when,body);$('activities').append(item)}
 const active=state.category!=='全部'||state.day||state.hour!==null||state.query;$('selection').replaceChildren();const parts=[];if(state.category!=='全部')parts.push(state.category);if(state.day)parts.push(state.day);if(state.hour!==null)parts.push(state.hour+' 时');if(state.query)parts.push('“'+state.query+'”');$('selection').append(el('span','',parts.length?parts.join(' / '):'按时间顺序，展示已整理的活动'));if(active){const clear=el('button','','清除筛选');clear.addEventListener('click',()=>{state.category='全部';state.day='';state.hour=null;state.query='';state.page=0;$('search').value='';render()});$('selection').append(clear)}
 $('empty').hidden=activities.length>0;$('empty-title').textContent=active?'没有符合筛选的活动':'还没有已整理的活动';$('empty-text').textContent=active?'换个关键词，或清除筛选查看所有记录。':v.pending_batches?'已有截图等待分析，完成整理后会显示在这里。':'完成分析的活动会出现在这里。未记录的时间不会被补写。';$('page-label').textContent=activities.length?'第 '+(state.page*pageSize+1)+'–'+Math.min((state.page+1)*pageSize,activities.length)+' 条，共 '+activities.length+' 条':'0 条活动';$('previous').disabled=state.page===0;$('next').disabled=state.page>=pages-1;
}
document.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>selectPeriod(b.dataset.period)));
document.querySelector('.tabs').addEventListener('keydown',e=>{let i=kinds.indexOf(state.period);if(e.key==='ArrowRight')i=(i+1)%kinds.length;else if(e.key==='ArrowLeft')i=(i+kinds.length-1)%kinds.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=kinds.length-1;else return;e.preventDefault();selectPeriod(kinds[i]);$('tab-'+kinds[i]).focus()});
$('search').addEventListener('input',e=>{state.query=e.target.value;state.page=0;renderActivities(view())});$('previous').addEventListener('click',()=>{state.page--;renderActivities(view())});$('next').addEventListener('click',()=>{state.page++;renderActivities(view())});$('print').addEventListener('click',()=>window.print());
// Printing includes all matching activity rows, then restores pagination.
window.addEventListener('beforeprint',()=>{printing=true;renderActivities(view())});window.addEventListener('afterprint',()=>{printing=false;renderActivities(view())});
$('generated').textContent='生成于 '+data.generated_at.slice(0,16).replace('T',' ')+' · '+data.timezone;$('sample').style.display=data.sample?'block':'none';render();
})();
</script>
</body>
</html>
